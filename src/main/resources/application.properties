# 1. KẾT NỐI MS SQL SERVER (Trỏ URL về SmarterASP, các thông tin khác đọc từ secret)
spring.datasource.url=jdbc:sqlserver://sql8011.site4now.net:1433;database=db_acffd2_elechaindb;encrypt=false;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Cấu hình Hibernate (Tự động tạo bảng trên SmarterASP)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port mặc định cho Render
server.port=8080

# Cấu hình SMTP (Không nhạy cảm, có thể public)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Khai báo cho Spring biết cần đọc thêm file secret (Chứa Username, Password, JWT, Cloudinary)
spring.profiles.include=secret