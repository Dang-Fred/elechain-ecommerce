<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Elechain">Elechain Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/halloween-theme.css}">
</head>
<body class="halloween-theme">

    <nav class="navbar navbar-expand-lg h-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-ghost"></i> ELECHAIN HALLOWEEN
            </a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Đăng nhập</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main layout:fragment="content" class="min-vh-100"></main>

    <footer class="text-center py-4 mt-5" style="background-color: var(--h-purple); border-top: 1px solid var(--h-orange);">
        <p class="mb-0 text-muted" style="color: #bbb !important;">&copy; 2026 Elechain Store. Trick or Treat!</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script layout:fragment="custom-js"></script>
</body>
</html>
