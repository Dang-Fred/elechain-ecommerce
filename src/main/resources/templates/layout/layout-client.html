<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <title layout:title-pattern="$CONTENT_TITLE | Elechain Store">Elechain Store</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet (Sử dụng đường dẫn tuyệt đối trỏ vào thư mục electro) -->
    <link th:href="@{/electro/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/electro/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/electro/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/electro/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Gọi Fragment Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- KHU VỰC THAY ĐỔI NỘI DUNG TỪNG TRANG -->
    <main layout:fragment="content"></main>

    <!-- Gọi Fragment Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/electro/lib/wow/wow.min.js}"></script>
    <script th:src="@{/electro/lib/owlcarousel/owl.carousel.min.js}"></script>

    <!-- Template Javascript -->
    <script th:src="@{/electro/js/main.js}"></script>
    
    <!-- 1. FILE CORE: Nạp hàm fetchWithAuth dùng chung -->
    <script th:src="@{/js/common.js}"></script>
    
    
    <!-- 2. Nơi các trang con (cart.html, shop.html) chèn script riêng biệt của chúng vào -->
    <th:block layout:fragment="custom-js"></th:block>
    
    <!-- JS XỬ LÝ CHẾ ĐỘ SÁNG TỐI -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const toggleBtn = document.getElementById('theme-toggle');
            const body = document.body;
            
            // 1. Kiểm tra bộ nhớ xem người dùng đang chọn chế độ nào
            const currentTheme = localStorage.getItem('theme');
            
            // 2. Nếu là dark, bật class và đổi icon sang Mặt trời
            if (currentTheme === 'dark') {
                body.classList.add('dark-mode');
                if(toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                if(toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }

            // 3. Xử lý sự kiện bấm nút
            if(toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    body.classList.toggle('dark-mode');
                    let theme = 'light';
                    
                    if (body.classList.contains('dark-mode')) {
                        theme = 'dark';
                        toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                    } else {
                        toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                    }
                    
                    // Lưu lại lựa chọn
                    localStorage.setItem('theme', theme);
                });
            }
        });
    </script>
</body>
</html>
