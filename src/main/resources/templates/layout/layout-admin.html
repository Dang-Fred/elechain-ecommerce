<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | Elechain Workspace">Hệ thống Quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* Nền Background Image có lớp phủ mờ (Overlay) */
        body { 
            /* Lớp gradient màu xanh đen mờ (0.6) phủ lên trên ảnh nền để form đăng nhập nổi bật hơn */
            background: linear-gradient(rgba(4, 25, 54, 0.6), rgba(4, 25, 54, 0.7)), 
                        url('/images/background-day.svg') no-repeat center center fixed;
            background-size: cover;
            color: #333; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .admin-navbar { 
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); 
            border-bottom: 3px solid #0d6efd;
        }
        
        .admin-navbar .navbar-brand { 
            color: #0d6efd; 
            font-weight: 800; 
            letter-spacing: 1px; 
        }
        
        /* Style chung cho Form */
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        .input-group-text {
            transition: all 0.3s ease;
        }
        .form-control:focus ~ .input-group-text,
        .form-control:focus + .input-group-text,
        .input-group:focus-within .input-group-text {
            color: #0d6efd !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg admin-navbar sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fa-solid fa-shield-halved me-2"></i> ELECHAIN WORKSPACE
            </a>
        </div>
    </nav>

    <!-- Khu vực linh hoạt co giãn chiếm phần còn lại của màn hình -->
    <main layout:fragment="content" class="container d-flex flex-column flex-grow-1"></main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script layout:fragment="custom-js"></script>
</body>
</html>
