<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Hệ thống Quản trị</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/admin/assets/icons/favicon.svg}">
    <link rel="icon" type="image/png" th:href="@{/admin/assets/icons/favicon.png}">
    
    <!-- Theme Color & Manifest -->
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" th:href="@{/admin/assets/manifest-D0qHSrzp.json}">
    
    <!-- Scripts & Styles -->
    <script type="module" crossorigin th:src="@{/admin/assets/main-BqKkk_Lj.js}"></script>
    <script type="module" crossorigin th:src="@{/admin/assets/rolldown-runtime-hePW80VL.js}"></script>
    <script type="module" crossorigin th:src="@{/admin/assets/vendor-ui-Be8JR3ju.js}"></script>
    <script type="module" crossorigin th:src="@{/admin/assets/vendor-bootstrap-Dj44xPS1.js}"></script>
    <script type="module" crossorigin th:src="@{/admin/assets/vendor-charts-_UPf9h_O.js}"></script>
    <script type="module" crossorigin th:src="@{/admin/assets/main-1Eks1J0_.js}"></script>
    <link rel="stylesheet" crossorigin th:href="@{/admin/assets/main-Kuf3cpUe.css}">
</head>

<body data-page="dashboard" class="admin-layout">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Admin App Container -->
    <div class="admin-app">
        <div class="admin-wrapper" id="admin-wrapper">

        <!-- Header -->
        <header class="admin-header">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center" th:href="@{/admin/dashboard}">
                        <img th:src="@{/admin/assets/images/logo.svg}" alt="Logo" height="32" class="d-inline-block align-text-top me-2">
                        <span class="h4 mb-0 fw-bold text-primary-emphasis">Elechain Admin</span>
                    </a>

                    <button class="hamburger-menu" type="button" data-sidebar-toggle aria-label="Toggle sidebar">
                        <i class="bi bi-list"></i>
                    </button>

                    <!-- Search Bar -->
                    <div class="search-container flex-grow-1 mx-4" x-data="searchComponent">
                        <div class="position-relative">
                            <input type="search" class="form-control" placeholder="Search... (Ctrl+K)" x-model="query" @input="search()" data-search-input>
                            <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3"></i>
                        </div>
                    </div>

                    <!-- Right Side Icons -->
                    <div class="navbar-nav flex-row">
                        <!-- Theme Toggle -->
                        <div x-data="themeSwitch">
                            <button class="btn btn-outline-secondary me-2" type="button" @click="toggle()">
                                <i class="bi bi-sun-fill" x-show="currentTheme === 'light'"></i>
                                <i class="bi bi-moon-fill" x-show="currentTheme === 'dark'"></i>
                            </button>
                        </div>

                        <!-- User Menu -->
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary d-flex align-items-center" type="button" data-bs-toggle="dropdown">
                                <img th:src="@{/admin/assets/images/avatar-placeholder.svg}" alt="User Avatar" width="24" height="24" class="rounded-circle me-2">
                                <span class="d-none d-md-inline" th:if="${role == 'ADMIN'}">Quản trị viên</span>
								<span class="d-none d-md-inline" th:if="${role == 'QLCN'}">Quản lý chi nhánh</span>
								<span class="d-none d-md-inline" th:if="${role == 'NV_BANHANG'}">Nhân viên bán hàng</span>
								<span class="d-none d-md-inline" th:if="${role == 'NV_KHO'}">Nhân viên kho</span>
                                <i class="bi bi-chevron-down ms-1"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                                <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-content">
                <nav class="sidebar-nav">
    				<ul class="nav flex-column">
        
       					 <!-- 1. Dashboard: Chỉ ADMIN và Quản lý Chi nhánh mới được xem -->
							<li class="nav-item" th:if="${role == 'ADMIN' or role == 'QLCN'}">
    							<a class="nav-link" th:href="@{/admin/dashboard}">
       								 <i class="bi bi-speedometer2"></i>
        								<span>Tổng quan</span>
    							</a>
							</li>

						<!-- 2. Kho & Sản phẩm: Chỉ ADMIN, QLCN và NV_KHO -->
							<li class="nav-item" th:if="${role == 'ADMIN' or role == 'QLCN'}">
    							<a class="nav-link" th:href="@{/admin/products}">
        							<i class="bi bi-box"></i>
        								<span>Quản lý Kho & Sản phẩm</span>
    							</a>
								</li>

<!-- 3. Quản lý Đơn hàng: Chỉ ADMIN, QLCN và NV_BANHANG -->
<li class="nav-item" th:if="${role == 'ADMIN' or role == 'QLCN' or role == 'NV_BANHANG'}">
    <a class="nav-link" th:href="@{/admin/orders}">
        <i class="bi bi-bag-check"></i>
        <span>Quản lý Đơn hàng</span>
    </a>
</li>

<!-- Quản lý Tồn kho: Chỉ Nhân viên kho (NV_KHO) mới được xem -->
<li class="nav-item" th:if="${role == 'NV_KHO'}">
    <a class="nav-link" th:href="@{/admin/inventory}">
        <!-- Thêm icon thùng hàng (bi-boxes) và khoảng cách (me-2) -->
        <i class="bi bi-boxes me-2"></i>
        <span>Quản lý Tồn kho</span>
    </a>
</li>

        <!-- 4. Quản lý Nhân sự: Quyền tối cao, CHỈ ADMIN thấy -->
        <li class="nav-item" th:if="${role == 'ROLE_ADMIN'}">
            <a class="nav-link" href="#">
                <i class="bi bi-people"></i>
                <span>Quản lý Nhân sự</span>
            </a>
        </li>

    </ul>
</nav>
            </div>
        </aside>

        <div class="sidebar-backdrop" aria-hidden="true"></div>
        
        <!-- Main Content -->
        <main id="main-content" class="admin-main">
            <!-- ĐÂY LÀ PHẦN LỖ HỔNG ĐỂ NHÚNG GIAO DIỆN CON VÀO -->
            <div layout:fragment="content"></div>
        </main>

        <!-- Footer -->
        <footer class="admin-footer">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-6">
                        <p class="mb-0 text-muted">© 2026 CuoiKyCNPM E-commerce</p>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <p class="mb-0 text-muted">Powered by Spring Boot & Thymeleaf</p>
                    </div>
                </div>
            </div>
        </footer>
        </div> <!-- /.admin-wrapper -->
    </div>

    <!-- Nơi nhúng script riêng cho từng trang con (nếu có) -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
