<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-client}"> <!-- Nhớ chỉnh lại đường dẫn layout cho đúng -->
<head>
    <title>Ví điện tử của tôi | Elechain Store</title>
</head>
<body>

<main layout:fragment="content">

    <!-- Single Page Header start -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6 wow fadeInUp" data-wow-delay="0.1s">Ví điện tử của tôi</h1>
        <ol class="breadcrumb justify-content-center mb-0 wow fadeInUp" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item active text-white">Ví điện tử</li>
        </ol>
    </div>
    <!-- Single Page Header End -->

    <!-- Wallet Content Start -->
    <div class="container-fluid py-5">
        <div class="container py-5 wow fadeInUp" data-wow-delay="0.1s">
            <div class="row g-5 justify-content-center">
                
                <!-- CARD 1: SỐ DƯ HIỆN TẠI -->
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-primary py-3 text-center">
                            <h5 class="mb-0 text-white"><i class="fas fa-wallet me-2"></i>Số dư hiện tại</h5>
                        </div>
                        <div class="card-body bg-light d-flex flex-column align-items-center justify-content-center py-5">
                            <!-- Nơi JS sẽ đổ số dư vào -->
                            <h2 id="txt-balance" class="text-success mb-3 fw-bold">
                                <span class="spinner-border spinner-border-sm text-success" role="status"></span> Đang tải...
                            </h2>
                            <p class="text-muted mb-0">Khả dụng để thanh toán đơn hàng</p>
                        </div>
                    </div>
                </div>

                <!-- CARD 2: NẠP THÊM TIỀN -->
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-secondary py-3 text-center">
                            <h5 class="mb-0 text-white"><i class="fas fa-coins me-2"></i>Nạp thêm tiền</h5>
                        </div>
                        <div class="card-body bg-light py-4">
                            <div class="mb-4">
                                <label for="input-topup-amount" class="form-label fw-bold">Số tiền cần nạp (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" id="input-topup-amount" class="form-control form-control-lg" placeholder="Ví dụ: 100000" min="1000" step="1000">
                            </div>
                            <button id="btn-topup" class="btn btn-primary w-100 py-3 text-white fw-bold text-uppercase">
                                <i class="fas fa-plus-circle me-2"></i>Xác nhận nạp tiền
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- Wallet Content End -->

</main>

<!-- Nhúng file JS xử lý Wallet -->
<th:block layout:fragment="custom-js">
    <script th:src="@{/js/wallet.js}"></script>
</th:block>

</body>
</html>
