<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-client}">
<head>
    <title>Cửa hàng | Elechain Store</title>
</head>
<body>

<main layout:fragment="content">

    <!-- Header Trang Cửa Hàng -->
    <div class="container-fluid page-header py-5">
        <h1 class="text-center text-white display-6 wow fadeInUp" data-wow-delay="0.1s">Sản Phẩm</h1>
        <ol class="breadcrumb justify-content-center mb-0 wow fadeInUp" data-wow-delay="0.3s">
            <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
            <li class="breadcrumb-item active text-white">Cửa hàng</li>
        </ol>
    </div>

    <!-- Nội dung chính -->
    <div class="container-fluid shop py-5">
        <div class="container py-5">
            
            <!-- BẮT ĐẦU FORM LỌC & TÌM KIẾM -->
            <form method="GET" th:action="@{/shop}">
                <div class="row g-4">
                    
                    <!-- SIDEBAR CỘT TRÁI (LỌC GIÁ) -->
                    <div class="col-lg-3 wow fadeInUp" data-wow-delay="0.1s">
                        
                        <div class="price mb-4">
                            <h4 class="mb-2">Mức giá tối đa</h4>
                            <!-- Thanh trượt lọc giá -->
                            <input type="range" class="form-range w-100" id="rangeInput" name="maxPrice" 
                                   min="0" max="50000000" step="500000" 
                                   th:value="${maxPrice != null ? maxPrice : 50000000}" 
                                   oninput="amount.value=new Intl.NumberFormat('vi-VN').format(rangeInput.value) + ' VNĐ'">
                            
                            <output id="amount" class="fw-bold text-primary mt-2 d-block"
                                    th:text="${maxPrice != null ? #numbers.formatDecimal(maxPrice, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : '50,000,000 VNĐ'}">
                            </output>
                        </div>
                        
                        <div class="d-flex justify-content-center my-4">
                            <button type="submit" class="btn btn-primary px-4 py-3 rounded-pill w-100">Áp dụng Lọc</button>
                        </div>
                        
                        <!-- Quảng cáo Sidebar -->
                        <div class="position-relative mt-5">
                            <img th:src="@{/electro/img/product-banner-2.jpg}" class="img-fluid w-100 rounded" alt="Khuyến mãi">
                            <div class="text-center position-absolute d-flex flex-column align-items-center justify-content-center rounded p-4"
                                style="width: 100%; height: 100%; top: 0; right: 0; background: rgba(242, 139, 0, 0.3);">
                                <h5 class="display-6 text-primary">SALE</h5>
                                <h4 class="text-white">Get UP To 50% Off</h4>
                                <a href="#" class="btn btn-primary rounded-pill px-4">Shop Now</a>
                            </div>
                        </div>
                    </div>

                    <!-- CỘT PHẢI (TÌM KIẾM & LƯỚI SẢN PHẨM) -->
                    <div class="col-lg-9 wow fadeInUp" data-wow-delay="0.1s">
                        
                        <!-- Thanh Tìm Kiếm (Tích hợp trong cùng Form Lọc) -->
                        <div class="row g-4 mb-4">
                            <div class="col-xl-9">
                                <div class="input-group w-100 mx-auto d-flex">
                                    <input type="search" name="keyword" th:value="${keyword}" class="form-control p-3" placeholder="Nhập tên sản phẩm để tìm kiếm...">
                                    <button type="submit" class="input-group-text p-3 btn-primary text-white"><i class="fa fa-search"></i></button>
                                </div>
                            </div>
                            <div class="col-xl-3 text-end d-flex align-items-center justify-content-end">
                                <a th:href="@{/shop}" class="btn btn-outline-secondary">Xóa bộ lọc</a>
                            </div>
                        </div>

                        <!-- Khu vực Lưới Sản Phẩm -->
                        <div class="tab-content">
                            <div id="tab-5" class="tab-pane fade show p-0 active">
                                <div class="row g-4 product">
                                    
                                    <!-- Render Sản Phẩm Động -->
                                    <div class="col-md-6 col-lg-4" th:each="sp : ${listSanPham}">
                                        <div class="product-item rounded h-100 d-flex flex-column wow fadeInUp" data-wow-delay="0.1s">
                                            <div class="product-item-inner border rounded flex-grow-1">
                                                <div class="product-item-inner-item">
                                                    <img th:src="${sp.logo}" class="img-fluid w-100 rounded-top" style="height: 250px; object-fit: contain; padding: 10px;" alt="Sản phẩm">
                                                    <div class="product-details">
                                                        <a th:href="@{/product/{id}(id=${sp.maSP})}"><i class="fa fa-eye fa-1x"></i></a>
                                                    </div>
                                                </div>
                                                <div class="text-center rounded-bottom p-4">
                                                    <a th:href="@{/product/{id}(id=${sp.maSP})}" class="d-block h4 text-truncate mb-3" th:title="${sp.tenSP}" th:text="${sp.tenSP}">Tên SP</a>
                                                    <span class="text-primary fs-5 fw-bold" th:text="${#numbers.formatDecimal(sp.giaBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">10.000 VNĐ</span>
                                                </div>
                                            </div>
                                            <div class="product-item-add border border-top-0 rounded-bottom text-center p-4 pt-0">
                                            
                                                <a href="#" class="btn btn-primary border-secondary rounded-pill py-2 px-4 w-100 add-to-cart-btn" th:attr="data-id=${sp.maSP}">
   													 <i class="fas fa-shopping-cart me-2"></i> Thêm vào giỏ
												</a>
                                                
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Thông báo nếu không tìm thấy -->
                                    <div class="col-12 text-center my-5" th:if="${listSanPham.isEmpty()}">
                                        <h4 class="text-muted">Không tìm thấy sản phẩm nào phù hợp!</h4>
                                    </div>

                                    <!-- THANH PHÂN TRANG -->
                                    <div class="col-12 mt-5" th:if="${totalPages > 1}">
                                        <nav aria-label="Page navigation">
                                            <ul class="pagination d-flex justify-content-center align-items-center mb-0" style="gap: 10px; flex-wrap: wrap;">
                                                
                                                <!-- Nút Trang trước -->
                                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                                    <a class="page-link d-flex justify-content-center align-items-center" 
                                                       th:href="@{/shop(page=${currentPage - 1}, keyword=${keyword}, maxPrice=${maxPrice})}" tabindex="-1" 
                                                       style="width: 45px; height: 45px; border-radius: 0; border: 1px solid #dee2e6; color: #6c757d; text-decoration: none;">
                                                        &lt;
                                                    </a>
                                                </li>
                                                
                                                <!-- Số Trang -->
                                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                                                    <a class="page-link d-flex justify-content-center align-items-center fw-bold" 
                                                       th:href="@{/shop(page=${i}, keyword=${keyword}, maxPrice=${maxPrice})}" th:text="${i + 1}" 
                                                       style="width: 45px; height: 45px; border-radius: 0; text-decoration: none; transition: all 0.3s;"
                                                       th:styleappend="${currentPage == i} ? 'background-color: var(--bs-primary); border: 1px solid var(--bs-primary); color: #fff;' : 'background-color: #fff; border: 1px solid #dee2e6; color: #6c757d;'">
                                                    </a>
                                                </li>
                                                
                                                <!-- Nút Trang sau -->
                                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                                    <a class="page-link d-flex justify-content-center align-items-center" 
                                                       th:href="@{/shop(page=${currentPage + 1}, keyword=${keyword}, maxPrice=${maxPrice})}" 
                                                       style="width: 45px; height: 45px; border-radius: 0; border: 1px solid #dee2e6; color: #6c757d; text-decoration: none;">
                                                        &gt;
                                                    </a>
                                                </li>
                                                
                                            </ul>
                                        </nav>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            
        </div>
    </div>

</main>

</body>
</html>
