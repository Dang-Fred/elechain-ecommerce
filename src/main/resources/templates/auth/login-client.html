<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập Khách hàng | Elechain Halloween</title>
    <!-- Nhúng CSS & JS qua Thymeleaf -->
    <link rel="stylesheet" th:href="@{/style.css}" />
    <script th:src="@{/resources.js}" defer></script>
    <script th:src="@{/script.js}" defer></script>
    <script th:src="@{/spider.js}" defer></script>
    <script th:src="@{/wolf.js}" defer></script>
</head>

<body>

    <div class="landscape-scene page-landscape" aria-hidden="true">
        <img class="scene-land scene-day" th:src="@{/images/background-day.svg}" alt="" />
        <img class="scene-land scene-night" th:src="@{/images/background-night.svg}" alt="" />
        <div class="sky-flight" aria-hidden="true">
            <span class="sky-bat bat-1"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
            <span class="sky-bat bat-2"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
            <span class="sky-bat bat-3"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
            <span class="sky-bat bat-4"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
            <span class="sky-bat bat-5"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
            <span class="sky-bat bat-6"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
            <span class="sky-witch">
                <span class="flyer-facing">
                    <img th:src="@{/images/witch.svg}" alt="" width="3600" height="3400" draggable="false">
                </span>
            </span>
        </div>
    </div>

    <div class="login-shell">
        <div class="halloween-vines" id="halloween-vines" aria-hidden="true"></div>
        <main class="login-card" aria-labelledby="login-title">
            <section class="scene-panel" aria-labelledby="welcome-title">
                <div class="landscape-scene" aria-hidden="true">
                    <div class="scene-sky-objects">
                        <div class="scene-sun"></div>
                        <div class="scene-moon"></div>
                    </div>
                    <img class="scene-land scene-day" th:src="@{/images/panel-day.svg}" alt="" />
                    <img class="scene-land scene-night" th:src="@{/images/panel-night.svg}" alt="" />
                    <div class="sky-flight" aria-hidden="true">
                        <span class="sky-bat bat-1"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
                        <span class="sky-bat bat-2"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
                        <span class="sky-bat bat-3"><span class="flyer-facing"><span data-svg="images/bat.svg" aria-hidden="true"></span></span></span>
                    </div>
                </div>
                <div class="summit-stage" aria-hidden="true"></div>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Bật đêm Halloween">
                    <span class="theme-toggle-thumb" aria-hidden="true"></span>
                    <span data-svg="images/icon-sun.svg" aria-hidden="true"></span>
                    <span data-svg="images/icon-moon.svg" aria-hidden="true"></span>
                </button>
                <div class="scene-copy">
                    <h2 id="welcome-title">ELECHAIN STORE</h2>
                    <p>Mua sắm đồ điện tử mùa Lễ hội. Giảm giá cực sốc, coi chừng hết hồn!</p>
                </div>
            </section>
            <section class="form-panel">
                <form class="login-form" id="login-form">
                    <h1 id="login-title">Đăng nhập</h1>
                    <div class="field">
                        <label class="sr-only" for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="Email" autocomplete="username" required />
                        <div class="email-owl" id="email-owl" aria-hidden="true">
                            <span data-svg="images/owl.svg" aria-hidden="true"></span>
                        </div>
                    </div>
                    <div class="field password">
                        <label class="sr-only" for="password">Mật khẩu</label>
                        <input id="password" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required />
                        <button class="eye" id="show-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="password">
                            <img th:src="@{/images/icon-eye.svg}" alt="" width="18" height="18" />
                        </button>
                    </div>
                    <button class="text-action forgot" id="forgot-password" type="button">Quên mật khẩu?</button>
                    <button class="submit" type="submit">
                        <span>Gõ Cửa Vào Nhà</span> <img th:src="@{/images/icon-arrow.svg}" alt="" width="17" height="17" />
                    </button>
                    <p class="signup-row">
    					<span>Bạn chưa có tài khoản?</span> 
   							 <a th:href="@{/register}" class="text-action" style="text-decoration: none;">Đăng ký ngay</a>
					</p>
                    <p class="status" id="status" role="status" aria-live="polite"></p>
                </form>
            </section>
        </main>
    </div>

    <canvas id="halloween-spider" aria-hidden="true"></canvas>
    <div class="flash-beam" id="flash-beam" aria-hidden="true"></div>
    <div class="password-reveal" id="password-reveal" aria-hidden="true">
        <span id="reveal-text"></span>
    </div>
    <div class="flashlight" id="flashlight" aria-hidden="true">
        <img th:src="@{/images/flashlight.svg}" alt="" width="33" height="33" />
    </div>

</body>
</html>
