<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-admin}">
<head>
    <title>Quản lý Chi nhánh</title>
</head>
<body class="branch-management">

<div layout:fragment="content">
    <div class="container-fluid p-4 p-lg-4">
        
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Quản lý Chi nhánh</h1>
                <p class="text-muted mb-0">Quản lý danh sách các chi nhánh của hệ thống</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary" onclick="loadBranches()">
                    <i class="bi bi-arrow-clockwise me-2"></i>Làm mới
                </button>
                <button type="button" class="btn btn-primary" onclick="openAddModal()">
                    <i class="bi bi-plus-lg me-2"></i>Thêm Chi nhánh mới
                </button>
            </div>
        </div>

        <!-- Bảng danh sách Chi nhánh -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white pt-3 pb-3 border-bottom">
                <h5 class="card-title mb-0 fw-bold">Danh sách Chi nhánh</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Tên Chi nhánh</th>
                                <th>Địa chỉ</th>
                                <th>Hotline</th>
                                <th>Trạng thái</th>
                                <th style="width: 160px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="branch-tbody">
                            <tr>
                                <td colspan="6" class="py-4 text-center text-muted">
                                    <div class="spinner-border spinner-border-sm" role="status"></div> Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
    </div>

    <!-- Modal Chi nhánh -->
    <div class="modal fade" id="branchModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="branchModalTitle">Thêm Chi nhánh</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="branchForm" onsubmit="saveBranch(event)">
                        <input type="hidden" id="maCN" name="maCN">
                        
                        <div class="mb-3">
                            <label class="form-label fw-medium">Tên chi nhánh <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tenCN" name="tenCN" required placeholder="Ví dụ: Chi nhánh Quận 1">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-medium">Địa chỉ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="diaChi" name="diaChi" required placeholder="Địa chỉ chi tiết">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-medium">Hotline <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="hotline" name="hotline" required placeholder="Số điện thoại liên hệ">
                        </div>
                        
                        <div class="modal-footer px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i> Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Trỏ đúng đường dẫn JS như yêu cầu -->
    <script th:src="@{/admin/js/branch.js}"></script>
</th:block>

</body>
</html>
