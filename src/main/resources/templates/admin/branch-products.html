<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-admin}">
<head>
    <title>Danh mục Sản phẩm Chi nhánh</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid p-4">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Mặt hàng đang kinh doanh</h1>
                <p class="text-muted mb-0">Quản lý danh sách sản phẩm được phép bán tại chi nhánh</p>
            </div>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#allocateModal" onclick="openAllocateModal()">
    <i class="bi bi-plus-circle me-2"></i>Thêm mặt hàng mới
</button>
        </div>

        <!-- Bảng danh sách sản phẩm tại chi nhánh -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
    <tr>
        <th style="width: 80px;">Mã SP</th>
        <th style="width: 60px;">Ảnh</th>
        <th>Tên Sản phẩm</th>
        <th>Giá bán</th>
        <th>Số lượng tồn</th>
        <th style="width: 120px;" class="text-center">Hành động</th>
    </tr>
</thead>
                        <tbody id="branch-products-tbody">
                            <tr>
                                <td colspan="5" class="py-4 text-center text-muted">
                                    <div class="spinner-border spinner-border-sm" role="status"></div> Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Phân bổ sản phẩm từ Master Data -->
    <div class="modal fade" id="allocateModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Phân bổ Sản phẩm về Chi nhánh</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light sticky-top">
    <tr>
        <th style="width: 80px;">Mã SP</th>
        <th style="width: 60px;">Ảnh</th>
        <th>Tên Sản phẩm</th>
        <th>Giá bán</th>
        <th style="width: 120px;" class="text-center">Hành động</th>
    </tr>
</thead>
                            <tbody id="master-products-tbody">
                                <!-- Dữ liệu Master Data render bằng JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <!-- BỔ SUNG DÒNG THƯ VIỆN NÀY ĐỂ FIX LỖI BOOTSTRAP IS NOT DEFINED -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:src="@{/admin/js/branch-products.js?v=1.1}"></script>
</th:block>

</body>
</html>
