<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-admin}">
<head>
    <title>Dashboard</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid p-4 p-lg-4">
        <!-- Page Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
            <div>
                <h1 class="h3 mb-0">Dashboard</h1>
                <p class="text-muted mb-0">Thống kê dữ liệu cửa hàng</p>
            </div>
            <div class="d-flex gap-2 flex-shrink-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-toggle="tooltip" title="Refresh data">
                    <i class="bi bi-arrow-clockwise icon-hover"></i>
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row g-3 g-lg-4 mb-4">
            <div class="col-sm-6 col-xl-3" x-data="statsCounter(12426, 5)">
                <div class="card stats-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="stats-icon bg-primary bg-opacity-10 text-primary">
                                    <i class="bi bi-people"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="h6 mb-0 text-muted">Tổng Khách hàng</p>
                                <div class="h3 mb-0" aria-live="polite" data-stat-value><span x-text="value.toLocaleString()">12,426</span></div>
                                <small class="text-success-emphasis"><i class="bi bi-arrow-up"></i> +12.5%</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="stats-icon bg-success bg-opacity-10 text-success">
                                    <i class="bi bi-graph-up"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="h6 mb-0 text-muted">Doanh thu</p>
                                <h3 class="mb-0">$54,320</h3>
                                <small class="text-success-emphasis"><i class="bi bi-arrow-up"></i> +8.2%</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="stats-icon bg-warning bg-opacity-10 text-warning">
                                    <i class="bi bi-bag-check"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="h6 mb-0 text-muted">Đơn hàng</p>
                                <h3 class="mb-0">1,852</h3>
                                <small class="text-danger-emphasis"><i class="bi bi-arrow-down"></i> -2.1%</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-sm-6 col-xl-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="stats-icon bg-info bg-opacity-10 text-info">
                                    <i class="bi bi-clock-history"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <p class="h6 mb-0 text-muted">Truy cập</p>
                                <h3 class="mb-0">2.3s</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="row g-4 mb-4">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="h5 card-title mb-0">Tổng quan Doanh thu</h2>
                    </div>
                    <div class="card-body">
                        <div id="revenueChart" style="min-height: 320px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card card-fill-row">
                    <div class="card-header">
                        <h2 class="h5 card-title mb-0">Hoạt động gần đây</h2>
                    </div>
                    <div class="card-body">
                        <div class="activity-feed">
                            <div class="activity-item">
                                <div class="activity-icon"><i class="bi bi-bag-check"></i></div>
                                <div class="activity-content">
                                    <p class="mb-1">Đơn hàng #1234 hoàn tất</p>
                                    <small class="text-muted">5 phút trước</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Các biểu đồ phụ khác ở dưới -->
        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header"><h2 class="h5 card-title mb-0">Tăng trưởng User (7 Ngày)</h2></div>
                    <div class="card-body"><div id="userGrowthChart" style="min-height: 280px;"></div></div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header"><h2 class="h5 card-title mb-0">Trạng thái Đơn hàng</h2></div>
                    <div class="card-body"><div id="orderStatusChart" style="min-height: 280px;"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
