<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-admin}">
<head>
    <title>Quản lý Đơn hàng</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid p-4 p-lg-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Quản lý Đơn hàng</h1>
                <p class="text-muted mb-0">Theo dõi và cập nhật trạng thái giao dịch</p>
            </div>
            <button class="btn btn-outline-secondary" onclick="loadOrders(0); loadSummary();" title="Làm mới">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>

        <!-- KHU VỰC 1: SUMMARY CARDS (CHỈ ADMIN VÀ QLCN THẤY) -->
        <div class="row g-3 mb-4" th:if="${vaiTro == 'ADMIN' or vaiTro == 'QLCN'}">
            <div class="col-md-3">
                <div class="card bg-primary bg-opacity-10 border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-primary mb-1">Tổng Đơn Hàng</h6>
                        <h3 class="mb-0 text-primary fw-bold" id="summary-total">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning bg-opacity-10 border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-warning text-dark mb-1">Chờ Duyệt</h6>
                        <h3 class="mb-0 text-warning text-dark fw-bold" id="summary-pending">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info bg-opacity-10 border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-info mb-1">Đang Giao</h6>
                        <h3 class="mb-0 text-info fw-bold" id="summary-delivering">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success bg-opacity-10 border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-success mb-1">Hoàn Thành</h6>
                        <h3 class="mb-0 text-success fw-bold" id="summary-completed">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- KHU VỰC 2: BẢNG DANH SÁCH ĐƠN HÀNG -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>Mã ĐH</th>
                                <th>Ngày đặt</th>
                                <th class="text-start">Khách hàng</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <!-- Cột thao tác ẩn hoàn toàn nếu là ADMIN -->
                                <th th:if="${vaiTro == 'QLCN' or vaiTro == 'NV_BANHANG'}">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <tr><td colspan="6" class="py-4 text-muted">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- (Tùy chọn: Chỗ này có thể chèn thẻ div làm Phân trang - Pagination sau này) -->
        </div>

    </div>
</div>

<th:block layout:fragment="scripts">
    <!-- Truyền biến vaiTro từ Backend xuống JS thông qua inline Javascript -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const currentRole = /*[[${vaiTro}]]*/ 'ADMIN';
        /*]]>*/
    </script>
    
    <!-- Nhúng file JS xử lý (dùng đường dẫn đã fix lỗi 404) -->
    <script th:src="@{/admin/js/orders.js}"></script>
</th:block>

</body>
</html>
