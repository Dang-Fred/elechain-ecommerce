<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-admin}">
<head>
    <title>Quản lý đơn hàng</title>
</head>
<body>

<!-- Nội dung trang Quản lý đơn hàng -->
<div layout:fragment="content">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="m-0 fw-bold text-primary">Danh sách Đơn hàng</h5>
            <button class="btn btn-success btn-sm">Tạo đơn mới</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Ngày Đặt</th>
                            <th>Người Nhận</th>
                            <th>Tổng Tiền</th>
                            <th>Trạng Thái</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body">
                        <!-- Javascript fetch API sẽ render dữ liệu vào đây -->
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">
                                <div class="spinner-border spinner-border-sm" role="status"></div> Đang tải dữ liệu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Phân trang có thể thiết kế sau -->
        </div>
    </div>
</div>

<!-- Nạp script riêng cho trang orders -->
<th:block layout:fragment="scripts">
    <script th:src="@{/admin/js/orders.js}"></script>
</th:block>

</body>
</html>
